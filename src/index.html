<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>StreamScout</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/svg+xml" href="brand/StreamScout-icon.svg" />
    <link rel="alternate icon" type="image/png" href="brand/app-icon-512.png" />
    <link rel="apple-touch-icon" href="brand/app-icon-180.png" />
  </head>
  <body>
    <div class="ss-loader" id="ssLoader" role="status" aria-label="Loading">
  <div class="ss-stage">
    <div class="ss-radar">
      <svg viewBox="0 0 512 512" aria-hidden="true">
        <defs>
          <linearGradient id="ssPlay" x1="180" y1="150" x2="360" y2="370" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#A78BFA"/>
            <stop offset=".55" stop-color="#8B5CF6"/>
            <stop offset="1" stop-color="#7C3AED"/>
          </linearGradient>
          <linearGradient id="ssWedge" x1="256" y1="256" x2="452" y2="256" gradientUnits="userSpaceOnUse">
            <stop offset="0" stop-color="#8B5CF6" stop-opacity="0"/>
            <stop offset=".7" stop-color="#8B5CF6" stop-opacity=".18"/>
            <stop offset="1" stop-color="#A78BFA" stop-opacity=".5"/>
          </linearGradient>
          <radialGradient id="ssVign" cx="256" cy="256" r="200" gradientUnits="userSpaceOnUse">
            <stop offset=".62" stop-color="#8B5CF6" stop-opacity="0"/>
            <stop offset="1" stop-color="#8B5CF6" stop-opacity=".07"/>
          </radialGradient>
          <filter id="ssSoft" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="2.2"/>
          </filter>
        </defs>
        <circle cx="256" cy="256" r="200" fill="url(#ssVign)"/>
        <circle cx="256" cy="256" r="196" fill="none" stroke="#8B5CF6" stroke-opacity=".30" stroke-width="6"/>
        <circle cx="256" cy="256" r="148" fill="none" stroke="#8B5CF6" stroke-opacity=".16" stroke-width="5"/>
        <circle cx="256" cy="256" r="96"  fill="none" stroke="#8B5CF6" stroke-opacity=".10" stroke-width="5"/>
        <g stroke="#8B5CF6" stroke-opacity=".5" stroke-width="6" stroke-linecap="round">
          <line x1="256" y1="48"  x2="256" y2="74"/>
          <line x1="256" y1="438" x2="256" y2="464"/>
          <line x1="48"  y1="256" x2="74"  y2="256"/>
          <line x1="438" y1="256" x2="464" y2="256"/>
        </g>
        <g class="ss-blips">
          <g class="ss-blip-wrap" data-angle="48" transform="translate(372,330)">
            <circle class="ss-halo" r="20" fill="none" stroke="#A78BFA" stroke-width="3"/>
            <circle class="ss-blip" r="7" fill="#A78BFA" filter="url(#ssSoft)"/>
            <circle class="ss-blip" r="4.5" fill="#EDE9FE"/>
          </g>
          <g class="ss-blip-wrap" data-angle="158" transform="translate(150,158)">
            <circle class="ss-halo" r="18" fill="none" stroke="#A78BFA" stroke-width="3"/>
            <circle class="ss-blip" r="6.5" fill="#A78BFA" filter="url(#ssSoft)"/>
            <circle class="ss-blip" r="4" fill="#EDE9FE"/>
          </g>
          <g class="ss-blip-wrap" data-angle="268" transform="translate(300,118)">
            <circle class="ss-halo" r="16" fill="none" stroke="#A78BFA" stroke-width="3"/>
            <circle class="ss-blip" r="6" fill="#A78BFA" filter="url(#ssSoft)"/>
            <circle class="ss-blip" r="3.5" fill="#EDE9FE"/>
          </g>
        </g>
        <g class="ss-sweep">
          <path d="M256 256 L452 256 A196 196 0 0 0 354.4 86.3 Z" fill="url(#ssWedge)"/>
          <line x1="256" y1="256" x2="452" y2="256" stroke="#A78BFA" stroke-width="5" stroke-linecap="round" stroke-opacity=".95"/>
          <circle cx="452" cy="256" r="5" fill="#EDE9FE"/>
        </g>
        <g class="ss-play">
          <path d="M214 182 L214 330 L342 256 Z" fill="url(#ssPlay)" stroke="url(#ssPlay)" stroke-width="16" stroke-linejoin="round"/>
        </g>
      </svg>
    </div>
    <div class="ss-caption">
      <div class="ss-word">Stream<span>Scout</span></div>
      <div class="ss-status"><span class="ss-status-text">Scanning</span><span class="ss-dots"></span></div>
    </div>
  </div>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Space+Mono&display=swap');
    .ss-loader { position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:radial-gradient(120% 120% at 50% 38%,#15121f 0%,#0c0b12 52%,#08070c 100%);color:#F4F1FB;font-family:'Space Grotesk',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;opacity:1;transition:opacity .45s ease; }
    .ss-loader.ss-hidden { opacity:0;pointer-events:none; }
    .ss-stage { display:grid;justify-items:center;gap:40px; }
    .ss-radar { position:relative;width:240px;height:240px; }
    .ss-radar svg { width:100%;height:100%;overflow:visible; }
    .ss-sweep { transform-origin:256px 256px;animation:ss-spin 2.4s linear infinite; }
    @keyframes ss-spin { to { transform:rotate(360deg); } }
    .ss-play { transform-origin:256px 256px;animation:ss-pulse 2.4s ease-in-out infinite; }
    @keyframes ss-pulse { 0%,100%{opacity:.85}50%{opacity:1} }
    .ss-blip,.ss-halo { opacity:0;transform-origin:center; }
    .ss-blip { transform:scale(.4); }
    .ss-blip.ss-ping { animation:ss-blipPing 1.1s ease-out forwards; }
    @keyframes ss-blipPing { 0%{opacity:0;transform:scale(.3)}12%{opacity:1;transform:scale(1.15)}30%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1)} }
    .ss-halo.ss-ping { animation:ss-haloPing 1.1s ease-out forwards; }
    @keyframes ss-haloPing { 0%{opacity:0;transform:scale(.2)}14%{opacity:.9}100%{opacity:0;transform:scale(2.6)} }
    .ss-blip.ss-lock { animation:none;opacity:1;transform:scale(1.1);transition:transform .3s ease; }
    .ss-halo.ss-lock { animation:none;opacity:.9;transform:scale(1.4); }
    .ss-caption { display:grid;justify-items:center;gap:14px; }
    .ss-word { font-size:27px;font-weight:600;letter-spacing:-.02em;line-height:1; }
    .ss-word span { color:#A78BFA; }
    .ss-status { font-family:'Space Mono',ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:rgba(167,139,250,.62);min-height:14px; }
    .ss-dots::after { content:'';animation:ss-dots 1.6s steps(4,end) infinite; }
    @keyframes ss-dots { 0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'} }
    .ss-loader.ss-done .ss-sweep { animation:none;transition:transform .5s cubic-bezier(.2,.7,.2,1); }
    .ss-loader.ss-done .ss-play { animation:none;opacity:1;transition:transform .5s cubic-bezier(.2,.7,.2,1);transform:scale(1.12); }
    .ss-loader.ss-done .ss-dots { display:none; }
    @media (prefers-reduced-motion:reduce) { .ss-sweep{animation-duration:6s} .ss-play{animation:none;opacity:1} }
  </style>
  <script>
    (function(){
      var root=document.getElementById('ssLoader');
      if(!root||root.__ssInit)return;root.__ssInit=true;
      var PERIOD=2400,sweep=root.querySelector('.ss-sweep'),wraps=[].slice.call(root.querySelectorAll('.ss-blip-wrap')),statusEl=root.querySelector('.ss-status-text');
      var phrases=['Scanning','Locking on','Matching titles','Almost there'],lastDeg=0,start=performance.now(),running=true,raf;
      function fire(wrap){wrap.querySelectorAll('.ss-blip,.ss-halo').forEach(function(el){el.classList.remove('ss-ping');void el.offsetWidth;el.classList.add('ss-ping');})}
      function tick(now){if(!running)return;var deg=((now-start)/PERIOD*360)%360;for(var i=0;i<wraps.length;i++){var a=parseFloat(wraps[i].dataset.angle);var crossed=lastDeg<=deg?(a>lastDeg&&a<=deg):(a>lastDeg||a<=deg);if(crossed)fire(wraps[i]);}lastDeg=deg;raf=requestAnimationFrame(tick);}
      raf=requestAnimationFrame(tick);
      var pi=0,phraseTimer=setInterval(function(){pi=(pi+1)%phrases.length;statusEl.textContent=phrases[pi];},2600);
      window.SSLoader={
        show:function(text){root.classList.remove('ss-hidden','ss-done');if(text){statusEl.textContent=text;clearInterval(phraseTimer);}if(!running){running=true;start=performance.now();lastDeg=0;raf=requestAnimationFrame(tick);}},
        hide:function(){root.classList.add('ss-hidden');running=false;cancelAnimationFrame(raf);clearInterval(phraseTimer);},
        done:function(text){running=false;cancelAnimationFrame(raf);clearInterval(phraseTimer);var target=wraps[0];var ang=parseFloat(target.dataset.angle);var cur=((performance.now()-start)/PERIOD*360)%360;var delta=((ang-cur)%360+360)%360;sweep.style.transform='rotate('+(cur+delta)+'deg)';root.classList.add('ss-done');statusEl.textContent=text||'Found it';target.querySelectorAll('.ss-blip,.ss-halo').forEach(function(el){el.classList.remove('ss-ping');el.classList.add('ss-lock');});setTimeout(function(){root.classList.add('ss-hidden');},900);}
      };
    })();
  </script>
</div>

    <app-root></app-root>
  </body>
</html>
