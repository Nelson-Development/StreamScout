@if (open()) {
  <div class="fb-backdrop" (click)="close()"></div>
  <div class="fb-popover">
    @if (!sent()) {
      <p class="fb-heading">Share feedback</p>
      <textarea class="fb-textarea" [(ngModel)]="message" placeholder="Bug, idea, request — anything goes…" rows="4" autofocus></textarea>
      <div class="fb-actions">
        <button class="fb-cancel" (click)="close()">Cancel</button>
        <button class="fb-submit" [disabled]="!message().trim() || sending()" (click)="submit()">
          {{ sending() ? 'Sending…' : 'Send' }}
        </button>
      </div>
    } @else {
      <div class="fb-sent">
        <span class="fb-sent-icon">✓</span>
        <p>Thanks for the feedback!</p>
      </div>
    }
  </div>
}

<button class="fb-fab" (click)="toggle()" [class.active]="open()" aria-label="Feedback">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
  </svg>
</button>
